<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky-blue gradient background -->
  <rect width="2732" height="2732" fill="url(#bg)"/>
  <!-- soft white glow behind the mascot -->
  <rect width="2732" height="2732" fill="url(#glow)"/>

  <!-- bear head centered: the icon composition scaled up (icon-space origin 256,300 lands on the canvas center) -->
  <g transform="translate(1366 1366) scale(2.9245) translate(-256 -300)">
    <!-- focus timer ring -->
    <g transform="rotate(-90 256 300)">
      <circle cx="256" cy="300" r="238" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="15" stroke-linecap="round" stroke-dasharray="1166 329"/>
    </g>

    <!-- ears -->
    <circle cx="146" cy="132" r="66" fill="#FCD34D" stroke="#F59E0B" stroke-width="13"/>
    <circle cx="366" cy="132" r="66" fill="#FCD34D" stroke="#F59E0B" stroke-width="13"/>
    <circle cx="146" cy="132" r="28" fill="#FCA5A5" opacity="0.55"/>
    <circle cx="366" cy="132" r="28" fill="#FCA5A5" opacity="0.55"/>

    <!-- head -->
    <circle cx="256" cy="300" r="212" fill="#FCD34D"/>
    <circle cx="256" cy="300" r="212" fill="none" stroke="#F59E0B" stroke-width="14"/>

    <!-- eyes -->
    <circle cx="180" cy="286" r="17" fill="#78350F"/>
    <circle cx="332" cy="286" r="17" fill="#78350F"/>
    <circle cx="185" cy="280" r="5.5" fill="#FFFFFF"/>
    <circle cx="337" cy="280" r="5.5" fill="#FFFFFF"/>

    <!-- blush -->
    <circle cx="140" cy="342" r="22" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="372" cy="342" r="22" fill="#FCA5A5" opacity="0.6"/>

    <!-- tiny nose -->
    <path d="M252 314 Q252 309 256 309 Q260 309 260 314 Q260 323 256 328 Q252 323 252 314 Z" fill="#B45309"/>

    <!-- smile -->
    <path d="M218 344 Q256 388 294 344" fill="none" stroke="#78350F" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
